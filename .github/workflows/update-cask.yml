name: Update Cask on New Release

on:
  schedule:
    - cron: '17 * * * *'
  repository_dispatch:
    types: [new-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-cask
  cancel-in-progress: false

jobs:
  update-cask:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test updater
        run: python3 -m unittest discover -s tests -v
      - name: Sync latest stable OSS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_cask.py
      - name: Validate casks
        run: |
          ruby -c Casks/kanivet.rb
          ruby -c official-cask-submission/kanivet.rb
          git diff --check
      - name: Commit and push verified update
        run: |
          if git diff --quiet -- Casks/kanivet.rb official-cask-submission/kanivet.rb; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/kanivet.rb official-cask-submission/kanivet.rb
          git commit -m "chore: sync latest stable Kanivet OSS release"
          git push origin HEAD:main
